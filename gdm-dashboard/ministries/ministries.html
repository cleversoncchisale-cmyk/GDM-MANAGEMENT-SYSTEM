<!DOCTYPE html>
<html lang="en">
<head> <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GDM Ministries</title>
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <div class="header-brand">
        <a href="../../index.html">Home</a>
        <span> / </span>
        <strong>Ministries</strong>
      </div>
      <nav class="header-nav">
        <a class="nav-item" href="../overview/overview.html">Overview</a>
        <a class="nav-item" href="../members/members.html">Members</a>
      </nav>
    </header>

    <main class="main-content">
      <section class="section-toolbar">
        <div>
          <p class="eyebrow">Ministries</p>
          <h1>Team performance and resources</h1>
          <p id="ministriesAdminHint" class="section-note">Admins can use the members page to add staff and the reports section to track ministry progress.</p>
        </div>
        <label class="search-box narrow">
          <input id="ministriesSearch" type="search" placeholder="Search by ministry or leader..." />
          <span>🔎</span>
        </label>
      </section>

      <section class="stats-grid" id="ministriesSummaryGrid">
        <article class="stat-card">
          <div class="number" id="totalMinistriesCount">0</div>
          <div class="label">Ministries</div>
        </article>
        <article class="stat-card">
          <div class="number" id="totalMembersCount">0</div>
          <div class="label">Members</div>
        </article>
        <article class="stat-card">
          <div class="number" id="totalReportsCount">0</div>
          <div class="label">Reports</div>
        </article>
      </section>

      <section class="ministry-cards" id="ministryCards"></section>

      <section class="panel glass-panel table-panel">
        <div class="section-header">
          <h2>Ministry summary table</h2>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Ministry</th>
                <th>Lead</th>
                <th>Progress</th>
                <th>Members</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ministryTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

 <!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>


<!-- Firebase initialization FIRST -->
<script src="../../js/firebase.js"></script>


<!-- Authentication -->
<script src="../../scripts/auth.js"></script>


<!-- Firestore database functions -->
<script src="../../scripts/firestore.js"></script>


<!-- Dashboard rendering -->
<script src="../../scripts/dashboard.js"></script>


<!-- Ministry functions -->
<script src="../../scripts/ministries.js"></script>


<!-- Notifications -->
<script src="../../scripts/notifications.js"></script>


<!-- Toast container -->
<div id="toastStack" class="toast-stack"></div>
</body>
</html>
